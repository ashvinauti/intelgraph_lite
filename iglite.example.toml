# IntelGraph Lite configuration. Every setting is optional.
# API keys are NOT read from this file: set OTX_API_KEY, VT_API_KEY and
# ABUSECH_AUTH_KEY in the environment instead.

db = "~/.iglite/iglite.db"

# Cost limits for one investigation.
depth = 1        # pivot hops from the starting indicators
budget = 50      # max indicators looked up
deadline = 60    # seconds; partial results are returned after this
workers = 8      # concurrent lookups

# False-positive controls
evidence_half_life_days = 180   # bad evidence halves in weight this often (0 = never fade)
alert_min_score = 60            # live alerts need at least this score (70 = malicious only)
# shared_infra = ["cloudflare", "akamai", "fastly", "google", "microsoft"]  # CDN/cloud owners

# Seconds between live network snapshots (`iglite watch`, `serve --watch`).
watch_interval = 30
watch_max_new = 25    # new IPs/domains looked up per snapshot

# Gateway mode: monitor every device behind a router/firewall (see README).
# Any of these switches it on; the CLI flags --syslog/--netflow/--conntrack/--tail do the same.
# gateway_syslog = "0.0.0.0:5514"           # router/firewall syslog (UDP)
# gateway_netflow = "0.0.0.0:2055"          # NetFlow v5/v9 / IPFIX (UDP)
# gateway_conntrack = true                  # when running on the Linux/OpenWrt gateway itself
# gateway_files = ["/var/log/pihole/pihole.log", "/var/log/suricata/eve.json"]
# gateway_leases = ["/tmp/dhcp.leases"]     # DHCP leases, for device names
# gateway_senders = ["192.168.1.1"]         # exporters allowed (default: any private address)
# lan_networks = ["10.0.0.0/8"]             # inside addresses (default: all private ranges)
# gateway_include_blocked = false           # also check flows the firewall blocked
# gateway_window = 300                      # seconds a flow stays in the live table

# AI agents (optional). Provider: "anthropic" (Claude; `pip install .[ai]` +
# ANTHROPIC_API_KEY in .env) or "ollama" (local model; nothing leaves the PC).
ai_provider = "anthropic"
# ai_model = "claude-opus-5-5"   # default per provider; e.g. "qwen2.5:7b" for ollama
# ollama_url = "http://localhost:11434"
ai_triage = "auto"      # auto | manual | off: AI false-positive triage of new alerts
ai_triage_per_hour = 20
ai_effort = "high"      # low | medium | high | xhigh | max
ai_max_steps = 10       # model turns per question

# Restrict or switch off sources (see `iglite sources`).
# enabled = ["rdap", "internetdb", "otx"]
disabled = []

# Free plain-text feeds, refreshed every 6 hours. Local paths work too.
[blocklists]
feodo = "https://feodotracker.abuse.ch/downloads/ipblocklist.txt"
urlhaus_online = "https://urlhaus.abuse.ch/downloads/text_online/"
# internal = "~/intel/our-blocklist.txt"

# Friendly names for LAN devices in gateway mode (DHCP names are learned automatically).
[devices]
# "192.168.1.40" = "Office printer"

# Known-good infrastructure, to counter false positives.
[allowlists]
# corporate = "~/intel/allowlist.txt"

# How much each source's verdict moves the score (0 to 1).
[trust]
virustotal = 0.8
urlhaus = 0.8
otx = 0.6
internetdb = 0.6
feodo = 0.8

# Seconds a cached answer stays fresh, per source.
[ttl]
virustotal = 86400

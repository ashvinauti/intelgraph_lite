<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IntelGraph Lite</title>
<style>
  :root {
    --surface-0: #f4f4f2; --surface-1: #fcfcfb; --surface-2: #efefec; --line: #e1e1dc; --line-strong: #c9c9c2;
    --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
    --accent: #2a78d6; --accent-ink: #ffffff;
    /* Status palette: always paired with an icon and a label. */
    --st-critical: #d03b3b; --st-warning: #fab219; --st-good: #0ca30c; --st-neutral: #8a8a84; --st-info: #2a78d6;
    --shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  :root[data-theme="dark"] {
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422; --line: #30302d; --line-strong: #46463f;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #94938b;
    --accent: #3987e5; --st-neutral: #85857f; --st-info: #3987e5; --shadow: 0 6px 24px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #242422; --line: #30302d; --line-strong: #46463f;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #94938b;
      --accent: #3987e5; --st-neutral: #85857f; --st-info: #3987e5; --shadow: 0 6px 24px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--surface-0); color: var(--text-primary);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; overflow-wrap: anywhere; }
  .muted { color: var(--text-muted); }
  .secondary { color: var(--text-secondary); }

  /* header */
  header { display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 52px; flex: none;
           background: var(--surface-1); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; min-width: 0; }
  nav a { padding: 6px 12px; border-radius: 6px; color: var(--text-secondary); text-decoration: none; white-space: nowrap; }
  nav a:hover { background: var(--surface-2); }
  nav a[aria-current="page"] { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
          border: 1px solid var(--line); background: var(--surface-1); cursor: pointer; white-space: nowrap; }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-neutral); }
  .pill.on .dot { background: var(--st-good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--st-good) 25%, transparent); }
  .icon-btn { border: 1px solid var(--line); background: var(--surface-1); border-radius: 6px; padding: 4px 8px; cursor: pointer; }

  /* layout */
  .shell { flex: 1; display: flex; min-height: 0; }
  main { flex: 1; overflow: auto; padding: 16px; min-width: 0; }
  section.view { display: none; }
  section.view.active { display: block; }
  .card { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 14px; min-width: 0; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); margin: 0 0 10px; }
  .grid { display: grid; gap: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--surface-1); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; text-align: left; }
  .tile:hover { border-color: var(--line-strong); }
  .tile .label { color: var(--text-secondary); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .tile .value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .two { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
  ul.feed { max-height: 62vh; overflow: auto; }
  @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }

  /* controls */
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .grow { flex: 1; min-width: 160px; }
  input[type=text], input[type=search], select, textarea {
    padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-0); }
  textarea { width: 100%; min-height: 84px; resize: vertical; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button.ghost { background: var(--surface-1); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: progress; }
  label.check { display: inline-flex; align-items: center; gap: 5px; color: var(--text-secondary); white-space: nowrap; }

  /* status badge: icon + label, color never alone */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px;
           border: 1px solid var(--line); background: var(--surface-1); font-size: 12px; white-space: nowrap; }
  .badge i { font-style: normal; font-size: 11px; width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center;
             color: #0b0b0b; background: var(--c, var(--st-neutral)); }
  .badge b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .v-malicious { --c: var(--st-critical); } .v-malicious i { color: #fff; }
  .v-suspicious { --c: var(--st-warning); } .v-benign { --c: var(--st-good); }
  .v-unknown, .v-unscored, .v-private { --c: var(--st-neutral); } .v-pending { --c: var(--st-info); } .v-pending i { color: #fff; }

  /* tables */
  .table-wrap { overflow: auto; max-height: calc(100vh - 220px); border: 1px solid var(--line); border-radius: 8px; background: var(--surface-1); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--surface-1); color: var(--text-secondary); font-weight: 500; z-index: 1;
       cursor: pointer; user-select: none; white-space: nowrap; }
  th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
  th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  td .nowrap, .nowrap { white-space: nowrap; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  .empty { padding: 28px; text-align: center; color: var(--text-muted); }

  /* verdict breakdown bar */
  .stack { display: flex; gap: 2px; height: 14px; margin: 6px 0 10px; }
  .stack div { background: var(--c); min-width: 3px; }
  .stack div:first-child { border-radius: 4px 0 0 4px; } .stack div:last-child { border-radius: 0 4px 4px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
  .legend span { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .legend .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }

  /* alerts list */
  ul.feed { list-style: none; margin: 0; padding: 0; }
  ul.feed li { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; padding: 8px 4px; border-bottom: 1px solid var(--line);
               cursor: pointer; align-items: baseline; }
  ul.feed li:hover { background: var(--surface-2); }
  ul.feed .sub { grid-column: 2 / 4; font-size: 12px; color: var(--text-secondary); }

  /* graph */
  #graph-wrap { position: relative; height: calc(100vh - 170px); min-height: 360px; border: 1px solid var(--line);
                border-radius: 8px; background: var(--surface-1); overflow: hidden; touch-action: none; }
  #graph { width: 100%; height: 100%; display: block; cursor: grab; }
  #graph.panning { cursor: grabbing; }
  #graph line { stroke: var(--line-strong); stroke-width: 1.3; }
  #graph line.hl { stroke: var(--accent); stroke-width: 2; }
  #graph g.node { cursor: pointer; }
  #graph g.node circle { stroke: var(--surface-1); stroke-width: 2; }
  #graph g.node.sel circle { stroke: var(--accent); stroke-width: 3; }
  #graph g.node.dim, #graph line.dim { opacity: .18; }
  #graph text { fill: var(--text-primary); font-size: 10.5px; paint-order: stroke; user-select: none;
                stroke: var(--surface-1); stroke-width: 3px; }
  #graph text.glyph { fill: #0b0b0b; stroke: none; font-size: 9px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
  .graph-hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--text-muted); pointer-events: none; }
  #tooltip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface-1); border: 1px solid var(--line);
             box-shadow: var(--shadow); border-radius: 6px; padding: 6px 9px; font-size: 12px; display: none; max-width: 360px; }

  /* detail drawer */
  aside#drawer { width: 420px; flex: none; border-left: 1px solid var(--line); background: var(--surface-1); overflow: auto;
                 padding: 16px; display: none; }
  aside#drawer.open { display: block; }
  @media (max-width: 640px) {
    header { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
    header h1 { flex: 1; }
    nav { order: 3; flex-basis: 100%; }
  }
  @media (max-width: 1000px) {
    aside#drawer { position: fixed; inset: 52px 0 0 auto; width: min(420px, 100vw); box-shadow: var(--shadow); z-index: 20; }
  }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .drawer-head h2 { margin: 0; }
  .big-score { font-size: 32px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .warn { border: 1px solid var(--st-warning); border-left-width: 4px; border-radius: 6px; padding: 8px 10px; margin: 10px 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .kv { display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: 4px 12px; font-size: 13px; }
  .kv dt { color: var(--text-secondary); } .kv dd { margin: 0; }
  .contrib { font-variant-numeric: tabular-nums; white-space: nowrap; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-secondary); margin: 18px 0 8px; }
  ul.links { list-style: none; padding: 0; margin: 0; font-size: 13px; }
  ul.links li { padding: 5px 0; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  ul.links li:hover { color: var(--accent); }

  /* toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; }
  .toast { background: var(--surface-1); border: 1px solid var(--line); border-left: 4px solid var(--c, var(--st-neutral));
           box-shadow: var(--shadow); border-radius: 6px; padding: 10px 12px; width: min(360px, calc(100vw - 32px)); cursor: pointer; }
  .toast .t { font-weight: 600; display: flex; gap: 6px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>IntelGraph Lite</h1>
  <nav aria-label="Views">
    <a href="#overview" data-view="overview">Overview</a>
    <a href="#live" data-view="live">Live network</a>
    <a href="#graph" data-view="graph">Graph</a>
    <a href="#indicators" data-view="indicators">Indicators</a>
  </nav>
  <button class="pill" id="watch-pill" title="Start or stop live network monitoring"><span class="dot"></span><span id="watch-label">Monitoring off</span></button>
  <button class="icon-btn" id="theme" title="Toggle light/dark theme">Dark</button>
</header>

<div class="shell">
<main>
  <!-- OVERVIEW -->
  <section class="view" id="view-overview">
    <div class="tiles" id="tiles"></div>
    <div class="grid two" style="margin-top:16px">
      <div class="grid">
        <div class="card">
          <h2>Verdicts</h2>
          <div class="stack" id="stack" role="img" aria-label="Indicators by verdict"></div>
          <div class="legend" id="legend"></div>
        </div>
        <div class="card">
          <h2>Investigate</h2>
          <textarea id="inv-text" placeholder="Paste indicators or a whole report: IPs, domains, URLs, hashes, CVEs. Defanged values like hxxp://evil[.]com work."></textarea>
          <div class="toolbar" style="margin:8px 0 0">
            <label class="check">Depth <select id="inv-depth"><option>0</option><option selected>1</option><option>2</option></select></label>
            <button class="primary" id="inv-go">Investigate</button>
            <span id="inv-msg" class="muted"></span>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>Recent alerts</h2>
        <ul class="feed" id="alert-feed"></ul>
      </div>
    </div>
  </section>

  <!-- LIVE NETWORK -->
  <section class="view" id="view-live">
    <div class="toolbar">
      <button class="primary" id="live-toggle">Start monitoring</button>
      <button class="ghost" id="live-scan">Scan now</button>
      <label class="check">Every
        <select id="live-interval"><option value="10">10 s</option><option value="30" selected>30 s</option><option value="60">1 min</option><option value="300">5 min</option></select>
      </label>
      <input type="search" class="grow" id="live-q" placeholder="Filter by process, IP or domain">
      <label class="check"><input type="checkbox" id="live-flagged"> Flagged only</label>
      <label class="check"><input type="checkbox" id="live-private"> Show local</label>
    </div>
    <p class="muted" id="live-status" style="margin:0 0 10px"></p>
    <div class="table-wrap"><table id="live-table"></table></div>
  </section>

  <!-- GRAPH -->
  <section class="view" id="view-graph">
    <div class="toolbar">
      <input type="search" class="grow" id="g-add" placeholder="Add an indicator to the graph (IP, domain, URL…) and press Enter">
      <button class="ghost" id="g-fit">Fit</button>
      <button class="ghost" id="g-labels">Labels on</button>
      <button class="ghost" id="g-clear">Clear</button>
      <span class="legend" id="g-legend"></span>
    </div>
    <div id="graph-wrap">
      <svg id="graph" aria-label="Knowledge graph"><g id="viewport"><g id="edges"></g><g id="nodes"></g></g></svg>
      <div class="graph-hint">Drag nodes · scroll to zoom · drag background to pan · double-click a node to expand</div>
    </div>
  </section>

  <!-- INDICATORS -->
  <section class="view" id="view-indicators">
    <div class="toolbar">
      <input type="search" class="grow" id="i-q" placeholder="Search values">
      <select id="i-verdict"><option value="">All verdicts</option><option>malicious</option><option>suspicious</option><option>benign</option><option>unknown</option></select>
      <select id="i-kind"><option value="">All kinds</option><option>ip</option><option>domain</option><option>url</option><option>hash</option><option>cve</option><option>email</option><option>process</option><option>org</option><option>tag</option><option>report</option></select>
      <a class="ghost" id="i-export" href="/api/export/stix" download="iglite-stix.json" style="text-decoration:none;padding:6px 12px;border:1px solid var(--line);border-radius:6px">Export STIX</a>
    </div>
    <div class="table-wrap"><table id="i-table"></table></div>
    <div class="toolbar" style="margin-top:10px"><button class="ghost" id="i-more">Load more</button><span class="muted" id="i-count"></span></div>
  </section>
</main>
<aside id="drawer" aria-label="Indicator details"></aside>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="tooltip" role="tooltip"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const fill = (node, ...kids) => node.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let token = null;
try { token = sessionStorage.getItem("iglite-token"); } catch (e) {}

async function api(path, body) {
  const headers = { "Content-Type": "application/json" };
  if (token) headers.Authorization = "Bearer " + token;
  const res = await fetch(path, body ? { method: "POST", headers, body: JSON.stringify(body) } : { headers });
  if (res.status === 401) {
    token = prompt("API token");
    try { sessionStorage.setItem("iglite-token", token || ""); } catch (e) {}
    if (!token) throw new Error("unauthorised");
    return api(path, body);
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node[k] = v;
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat()) if (c != null && c !== false) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const ICON = { malicious: "✕", suspicious: "!", benign: "✓", unknown: "?", unscored: "?", pending: "…", private: "⌂" };
function badge(verdict, score) {
  const v = verdict || "unscored";
  return el("span", { class: "badge v-" + v }, el("i", { "aria-hidden": "true" }, ICON[v] || "?"), v,
            score != null ? el("b", {}, score) : null);
}
const timeAgo = ts => {
  const s = Math.max(0, Date.now() / 1000 - ts);
  return s < 60 ? `${Math.round(s)}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : new Date(ts * 1000).toLocaleDateString();
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const VERDICTS = ["malicious", "suspicious", "unknown", "benign"];
const VCOLOR = { malicious: "--st-critical", suspicious: "--st-warning", benign: "--st-good", unknown: "--st-neutral", unscored: "--st-neutral" };

/* sortable table: columns = [{key, label, num, render(row)}] */
function renderTable(table, columns, rows, sort, onSort, onRow, selectedKey) {
  const sorted = [...rows].sort((a, b) => {
    const col = columns.find(c => c.key === sort.key) || columns[0];
    const va = col.sortValue ? col.sortValue(a) : a[col.key], vb = col.sortValue ? col.sortValue(b) : b[col.key];
    const cmp = va == null ? 1 : vb == null ? -1 : (typeof va === "number" ? va - vb : String(va).localeCompare(String(vb)));
    return sort.dir === "asc" ? cmp : -cmp;
  });
  const head = el("tr", {}, columns.map(c => el("th", {
    class: c.num ? "num" : null, scope: "col",
    "aria-sort": sort.key === c.key ? (sort.dir === "asc" ? "ascending" : "descending") : null,
    onclick: () => onSort(c.key),
  }, c.label)));
  const body = sorted.map(r => el("tr", { class: r.key === selectedKey ? "selected" : null, onclick: () => onRow(r) },
    columns.map(c => el("td", { class: c.num ? "num" : null }, c.render ? c.render(r) : (r[c.key] ?? "")))));
  fill(table, el("thead", {}, head), el("tbody", {}, body));
  if (!rows.length) table.append(el("tbody", {}, el("tr", {}, el("td", { colspan: columns.length, class: "empty" }, table.dataset.empty || "Nothing to show."))));
}
const VRANK = { malicious: 0, suspicious: 1, pending: 2, unknown: 3, unscored: 3, benign: 4, private: 5 };

/* ---------- theme ---------- */
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  $("theme").textContent = isDark() ? "Light" : "Dark";
}
applyTheme(store.get("iglite-theme"));
$("theme").onclick = () => {
  const next = isDark() ? "light" : "dark";
  applyTheme(next); store.set("iglite-theme", next); Graph.render();
};

/* ---------- routing ---------- */
let view = "overview";
function route() {
  view = (location.hash || "#overview").slice(1);
  if (!$("view-" + view)) view = "overview";
  document.querySelectorAll("section.view").forEach(s => s.classList.toggle("active", s.id === "view-" + view));
  document.querySelectorAll("nav a").forEach(a => a.setAttribute("aria-current", a.dataset.view === view ? "page" : "false"));
  refreshView();
  if (view === "graph") Graph.resize();
}
window.addEventListener("hashchange", route);

/* ---------- overview ---------- */
let stats = null, watch = { running: false };
async function refreshStats() {
  stats = await api("/api/stats");
  const v = stats.by_verdict;
  const tiles = [
    ["Indicators", stats.nodes, null, "#indicators"],
    ["Malicious", v.malicious || 0, "malicious", "#indicators?malicious"],
    ["Suspicious", v.suspicious || 0, "suspicious", "#indicators?suspicious"],
    ["Live connections", watch.connections ?? 0, null, "#live"],
    ["Alerts", stats.alerts || 0, null, "#overview"],
  ];
  fill($("tiles"), ...tiles.map(([label, value, verdict, href]) => el("button", {
    class: "tile", onclick: () => {
      const [h, filter] = href.split("?");
      if (filter) { $("i-verdict").value = filter; Indicators.reset(); }
      location.hash = h;
    } }, el("div", { class: "label" }, verdict ? badge(verdict) : label), el("div", { class: "value" }, value.toLocaleString()))));

  const total = VERDICTS.reduce((s, k) => s + (v[k] || 0), 0);
  fill($("stack"), ...VERDICTS.filter(k => v[k]).map(k => el("div", {
    style: `flex:${v[k]};--c:var(${VCOLOR[k]})`, title: `${k}: ${v[k]} (${Math.round(100 * v[k] / total)}%)` })));
  fill($("legend"), ...VERDICTS.map(k => el("span", {
    onclick: () => { $("i-verdict").value = k; Indicators.reset(); location.hash = "#indicators"; } },
    el("i", { class: "sw", style: `--c:var(${VCOLOR[k]})` }), `${k} `, el("b", {}, (v[k] || 0).toLocaleString()))));
}

let alertsSince = 0, alertsPrimed = false, recentAlerts = [], alertsInFlight = null;

    ev.preventDefault();
    const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
    const k = Math.min(4, Math.max(0.15, Graph.view.k * Math.exp(-ev.deltaY * 0.0015)));
    Graph.view.x = mx - (mx - Graph.view.x) * k / Graph.view.k; Graph.view.y = my - (my - Graph.view.y) * k / Graph.view.k; Graph.view.k = k; Graph.render();
  }, { passive: false });
  $("g-add").addEventListener("keydown", async ev => {
    if (ev.key !== "Enter" || !ev.target.value.trim()) return;
    await Graph.load(ev.target.value.trim(), true); ev.target.value = "";
  });
  $("g-fit").onclick = () => Graph.fit();
  $("g-clear").onclick = () => { Graph.nodes.clear(); Graph.edges.clear(); Graph.build(); };
  $("g-labels").onclick = ev => { Graph.labels = !Graph.labels; ev.target.textContent = Graph.labels ? "Labels on" : "Labels off"; Graph.build(); };
  window.addEventListener("resize", () => Graph.resize());
})();

/* ---------- polling (paused while the tab is hidden) ---------- */
async function refreshView() {
  try {
    if (view === "overview") await Promise.all([refreshStats(), pollAlerts()]);
    else if (view === "live") await Live.refresh();
    else if (view === "indicators" && !Indicators.rows.length) await Indicators.reset();
    else if (view === "graph" && !Graph.nodes.size) {
      const top = await api("/api/indicators?limit=8&verdict=malicious");
      const more = top.length ? top : await api("/api/indicators?limit=8");
      for (const n of more) await Graph.load(n.key, false);
      setTimeout(() => Graph.fit(), 900);
    }
  } catch (e) { /* surfaced by the next successful poll */ }
}
async function poll() {
  if (!document.hidden) {
    try {
      watch = await api("/api/watch"); paintWatch();
      await pollAlerts();
      if (view === "live" && watch.running) await Live.refresh();
      if (view === "overview") await refreshStats();
    } catch (e) {}
  }
  setTimeout(poll, 5000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { refreshView(); Graph.kick(0.05); } });
Graph.legend();
route();
poll();
</script>
